name: sbcl

# The SBCL port (sbcl/) has its own test suite, which the Rust gauntlet does
# not run. sbcl/lib holds byte copies of lib/, so shared-stdlib changes can
# break it too.

on:
  push:
    branches: ["main"]
    paths:
      - "sbcl/**"
      - "conformance/**"
      - "lib/**"
      - ".github/workflows/sbcl.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "sbcl/**"
      - "conformance/**"
      - "lib/**"
      - ".github/workflows/sbcl.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: sbcl port test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sbcl
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: run-tests
        working-directory: sbcl
        run: sbcl --non-interactive --load tests/run-tests.lisp
      - name: conformance
        run: sbcl --non-interactive --load conformance/ports/run-sbcl.lisp
