name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches versions and changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          root=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cli=$(grep -m1 '^version' cli/Cargo.toml | cut -d'"' -f2)
          [ "$v" = "$root" ] || { echo "tag $v != Cargo.toml $root" >&2; exit 1; }
          [ "$v" = "$cli" ] || { echo "tag $v != cli/Cargo.toml $cli" >&2; exit 1; }
          grep -q "^# v$v " CHANGELOG.md || { echo "CHANGELOG.md has no '# v$v' heading" >&2; exit 1; }
      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main" >&2; exit 1; }

  build:
    needs: verify
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: lamedh
            asset_name: lamedh-linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: lamedh
            asset_name: lamedh-linux-aarch64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }} --package lamedh-cli

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --package lamedh-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten and rename artifacts
        run: |
          mkdir -p release/
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            file=$(find "$dir" -type f | head -1)
            cp "$file" "release/$name"
          done
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
